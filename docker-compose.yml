services:
  mcp:
    build: .
    command: sh -c "python ingest.py --if-empty && python mcp_server.py"
    ports: ["8001:8001"]
    volumes:
      - ./doc:/data/doc:ro
      - ./chroma_data:/data/chroma
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8001))"]
      interval: 5s
      retries: 60

  backend:
    build: .
    command: uvicorn backend:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    env_file: .env
    environment:
      MCP_URL: http://mcp:8001/mcp
    depends_on:
      mcp:
        condition: service_healthy
